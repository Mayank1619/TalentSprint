name: CI/CD Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - "codex/feature/**"
      - "codex/specs/**"
      - "codex/spec/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: talent-sprint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  unit_tests:
    name: 1. Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  automation_tests:
    name: 2. Automation Tests
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run automation tests
        run: npm run test:automation

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency_audit:
    name: 3a. Dependency Vulnerability Gate
    runs-on: ubuntu-latest
    needs: automation_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high and critical dependency vulnerabilities
        run: npm run security:audit

      - name: Show moderate dependency findings without blocking
        if: always()
        run: npm audit --audit-level=moderate || true

  codeql_analysis:
    name: 3b. CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: automation_tests
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  semgrep_sast:
    name: 3c. Semgrep SAST
    runs-on: ubuntu-latest
    needs: automation_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep Community Edition
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run Semgrep security rules
        run: >
          semgrep scan
          --config p/default
          --config p/javascript
          --config p/typescript
          --error
          --exclude node_modules
          --exclude .next
          --exclude playwright-report
          --exclude test-results

  secret_scan:
    name: 3d. Secret Scan
    runs-on: ubuntu-latest
    needs: automation_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:latest
          git --no-banner --redact --verbose /repo

  zap_baseline:
    name: 3e. OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: automation_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Start production app for ZAP
        run: npm run start -- --hostname 0.0.0.0 --port 3101 > next-zap.log 2>&1 &

      - name: Wait for production app
        run: |
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3101 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat next-zap.log
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:3101"
          fail_action: true
          allow_issue_writing: false
          rules_file_name: "zap-rules.tsv"
          cmd_options: "-a -m 2"

  sonarqube_quality_gate:
    name: 3f. SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: automation_tests
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build before analysis
        run: npm run build

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  deploy_vercel:
    name: 4. Deploy to Vercel
    runs-on: ubuntu-latest
    needs:
      - dependency_audit
      - codeql_analysis
      - semgrep_sast
      - secret_scan
      - zap_baseline
      - sonarqube_quality_gate
    if: ${{ always() && needs.dependency_audit.result == 'success' && needs.codeql_analysis.result == 'success' && needs.semgrep_sast.result == 'success' && needs.secret_scan.result == 'success' && needs.zap_baseline.result == 'success' && (needs.sonarqube_quality_gate.result == 'success' || needs.sonarqube_quality_gate.result == 'skipped') && github.event_name == 'push' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pull Vercel environment
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: Build Vercel output
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx vercel build --prod --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy Vercel output
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }}

      - name: Skip deploy when Vercel secrets are missing
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "Vercel deploy skipped because VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID is not configured."
          echo "All quality gates completed before this deploy decision."
